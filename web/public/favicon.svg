  <path d="M17 7 L25 7 Q26 7 26 8 L26 23 Q26 24 25 24 L17 24 Z" fill="white" opacity="0.8"/>
  <!-- 左页文字线 -->
  <line x1="8" y1="11" x2="13" y2="11" stroke="#07C160" stroke-width="1.2" stroke-linecap="round" opacity="0.5"/>
  <line x1="8" y1="14" x2="12.5" y2="14" stroke="#07C160" stroke-width="1.2" stroke-linecap="round" opacity="0.35"/>
  <line x1="8" y1="17" x2="13" y2="17" stroke="#07C160" stroke-width="1.2" stroke-linecap="round" opacity="0.35"/>
  <line x1="8" y1="20" x2="11" y2="20" stroke="#07C160" stroke-width="1.2" stroke-linecap="round" opacity="0.25"/>
  <!-- 右页文字线 -->
  <line x1="19" y1="11" x2="24" y2="11" stroke="#07C160" stroke-width="1.2" stroke-linecap="round" opacity="0.4"/>
  <line x1="19" y1="14" x2="23.5" y2="14" stroke="#07C160" stroke-width="1.2" stroke-linecap="round" opacity="0.3"/>
  <line x1="19" y1="17" x2="24" y2="17" stroke="#07C160" stroke-width="1.2" stroke-linecap="round" opacity="0.3"/>
  <!-- 书脊中线 -->
  <line x1="16" y1="7" x2="16" y2="24" stroke="#07C160" stroke-width="0.8" opacity="0.2"/>
  <!-- Plus 角标 -->
  <circle cx="25" cy="7" r="5.5" fill="#07C160"/>
  <rect x="23.2" y="5.2" width="3.6" height="3.6" rx="0.8" fill="#07C160"/>
  <line x1="25" y1="4" x2="25" y2="10" stroke="white" stroke-width="1.8" stroke-linecap="round"/>
  <line x1="22" y1="7" x2="28" y2="7" stroke="white" stroke-width="1.8" stroke-linecap="round"/>
